services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       library_db
      POSTGRES_USER:     library_user
      POSTGRES_PASSWORD: library_pass
    ports:
      - "5555:5432"           # keeps your local port convention
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./library-management
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      # Override datasource to point at the postgres container (not localhost)
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/library_db
      SPRING_DATASOURCE_USERNAME: library_user
      SPRING_DATASOURCE_PASSWORD: library_pass
      # JWT — read from your .env file (never hardcode these)
      JWT_SECRET:     ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    depends_on:
      postgres:
        condition: service_healthy   # waits until postgres is actually ready

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./library-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"               # access the app at http://localhost:5173
    depends_on:
      - backend

volumes:
  postgres_data:                # data persists across restarts
